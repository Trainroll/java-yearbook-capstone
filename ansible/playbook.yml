- name: Configure capstone application server
  hosts: app
  become: true
  gather_facts: true

  tasks:
    - name: Upgrade installed packages
      ansible.builtin.yum:
        name: "*"
        state: latest

    - name: Install Docker
      ansible.builtin.yum:
        name: docker
        state: present

    - name: Create Docker CLI plugins directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: "0755"

    - name: Install Docker Buildx plugin
      ansible.builtin.get_url:
        url: https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-amd64
        dest: /usr/local/lib/docker/cli-plugins/docker-buildx
        mode: "0755"

    - name: Enable and start docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application deployment directory
      ansible.builtin.file:
        path: /opt/yearbook-capstone
        state: directory
        mode: "0755"

    - name: Create Docker CLI plugins directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: "0755"

    - name: Install Docker Compose plugin
      ansible.builtin.get_url:
        url: https://github.com/docker/compose/releases/download/v5.6.1/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: "0755"

    - name: Copy Docker Compose and Nginx Configuration
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: /opt/yearbook-capstone/
        mode: preserve
      loop:
        - src: ../docker-compose.yml
        - src: ../docker-compose.prod.yml
      when: deployment_mode in ['PORTFOLIO', 'FULL']

    - name: Copy Nginx Configuration
      ansible.builtin.copy:
        src: ../nginx.conf
        dest: /opt/yearbook-capstone/nginx.conf
        mode: preserve
      when: deployment_mode in ['PORTFOLIO', 'FULL']

    - name: Copy portfolio directory including avatar assets
      ansible.builtin.copy:
        src: ../myportfolio
        dest: /opt/yearbook-capstone/
        mode: preserve
      when: deployment_mode == 'PORTFOLIO' or deployment_mode == 'FULL'

    - name: Copy Java application directory
      ansible.builtin.copy:
        src: ../java
        dest: /opt/yearbook-capstone/
        mode: preserve
      when: deployment_mode == 'JAVA' or deployment_mode == 'FULL'

    - name: Deploy Java application
      become: true
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build yearbook
        chdir: /opt/yearbook-capstone
      when: deployment_mode in ['JAVA', 'FULL']

    - name: Deploy portfolio service
      become: true
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d portfolio
        chdir: /opt/yearbook-capstone
      when: deployment_mode in ['PORTFOLIO', 'FULL']
