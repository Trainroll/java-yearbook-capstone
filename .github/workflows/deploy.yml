name: Deploy Java Yearbook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Java application
        run: mvn -f java/pom.xml clean package

      - name: Deploy to EC2
        run: |
          ansible-playbook -i "98.89.67.243," \
            -u ec2-user \
            --private-key /home/rul3/keys/m_key.pem \
            ansible/playbook.yml

      - name: HTTP smoke tests
        run: |
          curl --fail --retry 5 --retry-delay 5 http://98.89.67.243/
          curl --fail --retry 5 --retry-delay 5 http://98.89.67.243/yearbook/
